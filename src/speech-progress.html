    <div id="speech-preparation">
      <p id="speech-stage" role="status" aria-live="polite">Waiting to speak.</p>
      <ul class="pipeline"><li id="split-state"></li><li id="phoneme-state"></li><li id="generation-state"></li></ul>
      <progress id="speech-progress" aria-label="Speech generation progress" max="1" value="0"></progress>
      <small>Word counts advance after each sentence or long-sentence chunk completes. The model does not report individual-word completion.</small>
      <details open><summary>Sentence breaks and progress</summary><ol id="sentence-progress" class="sentence-progress"></ol></details>
      <details><summary>Current phonemes</summary><p id="phoneme-text"></p></details>
    </div>
